<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Ball Sort Puzzle</title>
<style>
:root{
  --bg1:#1e2749; --bg2:#3f2b96; --bg3:#5f27cd;
  --glass-bg:rgba(255,255,255,0.08); --glass-border:rgba(255,255,255,0.18);
  --text:#f5f6fa; --shadow:rgba(0,0,0,0.45); --accent:#54a0ff;
}
body.light{
  --bg1:#a1c4fd; --bg2:#c2e9fb; --bg3:#89f7fe;
  --glass-bg:rgba(255,255,255,0.55); --glass-border:rgba(255,255,255,0.7);
  --text:#1e2749; --shadow:rgba(0,0,0,0.15);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  color:var(--text);
  transition:background .5s, color .3s;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.app{max-width:1000px;margin:0 auto;padding:10px;min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:18px;padding:10px 16px;box-shadow:0 8px 32px var(--shadow);
}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:.5px;white-space:nowrap;}
.stats{display:flex;gap:14px;flex-wrap:wrap;}
.stat{display:flex;flex-direction:column;align-items:center;font-size:.7rem;min-width:46px;opacity:.9;}
.stat span:last-child{font-size:1.05rem;font-weight:700;}
.topbtns{display:flex;gap:6px;}
.iconbtn{
  background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text);
  border-radius:12px;width:38px;height:38px;font-size:1.05rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s;
}
.iconbtn:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 6px 16px var(--shadow);}
.iconbtn:active{transform:scale(.92);}
.progress-wrap{height:8px;background:rgba(255,255,255,.18);border-radius:6px;margin:10px 2px;overflow:hidden;}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#54a0ff,#1dd1a1);transition:width .5s;border-radius:6px;}
.game-area{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 4px;min-height:280px;}
.tubes-container{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-end;max-width:100%;}
.tube{
  width:62px;height:250px;display:flex;flex-direction:column-reverse;align-items:center;
  padding:8px 6px;gap:6px;border-radius:8px 8px 32px 32px;
  border:3px solid var(--glass-border);background:rgba(255,255,255,0.07);
  box-shadow:inset 0 0 18px rgba(255,255,255,.06),0 10px 22px var(--shadow);
  position:relative;cursor:pointer;transition:transform .2s,box-shadow .2s;
}
.tubes-container.compact .tube{width:46px;height:190px;padding:6px 4px;gap:4px;border-radius:6px 6px 24px 24px;}
.tubes-container.compact .ball{width:32px;height:32px;}
.tube:hover{transform:translateY(-4px);}
.tube.selected{transform:translateY(-16px);box-shadow:0 0 0 3px var(--accent),0 16px 30px var(--shadow);}
.tube.cursor{outline:2px dashed rgba(255,255,255,.7);outline-offset:5px;}
.tube.hint-from{box-shadow:0 0 0 3px #feca57,0 16px 30px var(--shadow);}
.tube.hint-to{box-shadow:0 0 0 3px #1dd1a1,0 16px 30px var(--shadow);}
@keyframes invalidShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.tube.invalid-shake{animation:invalidShake .4s ease;}
.ball{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  box-shadow:inset -4px -4px 8px rgba(0,0,0,.25),inset 4px 4px 8px rgba(255,255,255,.45),0 4px 6px rgba(0,0,0,.3);
  transition:opacity .25s ease;
}
.ball-flying{position:fixed;border-radius:50%;z-index:600;pointer-events:none;
  transition:left .35s cubic-bezier(.4,0,.2,1), top .35s cubic-bezier(.4,0,.2,1);
  box-shadow:inset -4px -4px 8px rgba(0,0,0,.25),inset 4px 4px 8px rgba(255,255,255,.45),0 6px 12px rgba(0,0,0,.4);
}
.controls{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(14px);
  border-radius:18px;padding:10px;box-shadow:0 8px 32px var(--shadow);margin-top:auto;
}
.controls button{
  background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text);
  border-radius:12px;padding:9px 14px;cursor:pointer;font-size:.85rem;font-weight:600;
  transition:transform .15s,box-shadow .15s;box-shadow:0 4px 12px var(--shadow);white-space:nowrap;
}
.controls button:hover{transform:translateY(-2px);box-shadow:0 8px 18px var(--shadow);}
.controls button:active{transform:translateY(0) scale(.95);}
.controls button:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}
#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:999;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal-overlay.show{display:flex;}
.modal{
  background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:22px;padding:26px;max-width:420px;width:100%;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.5);animation:popIn .3s ease;max-height:88vh;overflow-y:auto;
}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{margin:0 0 6px;}
.stars-row{font-size:2.2rem;margin:12px 0;letter-spacing:6px;}
.modal-stats{display:flex;justify-content:center;gap:22px;margin:14px 0;}
.modal-stats div{display:flex;flex-direction:column;font-size:.75rem;opacity:.85;}
.modal-stats div span{font-size:1.2rem;font-weight:800;color:var(--text);}
.modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.modal-actions button{
  background:linear-gradient(135deg,#54a0ff,#1dd1a1);border:none;color:#fff;border-radius:12px;
  padding:10px 18px;font-weight:700;cursor:pointer;transition:transform .15s;
}
.modal-actions button.secondary{background:var(--glass-bg);color:var(--text);border:1px solid var(--glass-border);}
.modal-actions button:hover{transform:translateY(-2px);}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--glass-border);text-align:left;}
.settings-row:last-child{border-bottom:none;}
.switch{position:relative;width:46px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider-el{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.25);border-radius:24px;transition:.3s;}
.slider-el:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s;}
input:checked + .slider-el{background:#1dd1a1;}
input:checked + .slider-el:before{transform:translateX(22px);}
.level-jump{display:flex;gap:6px;margin-top:6px;}
.level-jump input{width:70px;padding:6px;border-radius:8px;border:1px solid var(--glass-border);background:rgba(255,255,255,.15);color:var(--text);text-align:center;}
.level-jump button{border-radius:8px;border:none;padding:6px 12px;background:var(--accent);color:#fff;cursor:pointer;font-weight:700;}
.ach-list{max-height:180px;overflow-y:auto;text-align:left;}
.ach-item{display:flex;gap:10px;align-items:center;padding:8px 4px;opacity:.4;}
.ach-item.unlocked{opacity:1;}
.ach-item .ach-icon{font-size:1.4rem;}
.ach-item .ach-name{font-weight:700;font-size:.85rem;}
.ach-item .ach-desc{font-size:.7rem;opacity:.75;}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(12px);
  padding:10px 20px;border-radius:14px;opacity:0;transition:opacity .3s, transform .3s;
  pointer-events:none;z-index:1200;font-weight:600;box-shadow:0 8px 24px var(--shadow);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.close-x{position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text);}
@media(max-width:480px){
  .tube{width:44px;height:196px;padding:5px 3px;gap:4px;border-radius:6px 6px 22px 22px;}
  .ball{width:30px;height:30px;}
  .tubes-container.compact{gap:12px;}
  .tubes-container.compact .tube{width:34px;height:150px;padding:4px 2px;gap:3px;border-radius:5px 5px 18px 18px;}
  .tubes-container.compact .ball{width:24px;height:24px;}
  .brand{font-size:.95rem;}
  .stats{gap:8px;}
  .stat{min-width:36px;font-size:.6rem;}
  .stat span:last-child{font-size:.9rem;}
  .controls button{padding:7px 9px;font-size:.72rem;}
  .iconbtn{width:32px;height:32px;font-size:.9rem;}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">🎨 Ball Sort</div>
    <div class="stats">
      <div class="stat"><span>Level</span><span id="statLevel">1</span></div>
      <div class="stat"><span>Moves</span><span id="statMoves">0</span></div>
      <div class="stat"><span>Time</span><span id="statTime">00:00</span></div>
      <div class="stat"><span>Best</span><span id="statBest">--</span></div>
    </div>
    <div class="topbtns">
      <button class="iconbtn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">🌙</button>
      <button class="iconbtn" id="btnSound" title="Toggle sound" aria-label="Toggle sound">🔊</button>
      <button class="iconbtn" id="btnSettings" title="Settings" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <main class="game-area">
    <div class="tubes-container" id="tubesContainer" role="group" aria-label="Puzzle tubes"></div>
  </main>

  <footer class="controls">
    <button id="btnPrev" title="Previous level">⏮ Prev</button>
    <button id="btnUndo" title="Undo (U)">↩ Undo</button>
    <button id="btnHint" title="Hint (H)">💡 Hint</button>
    <button id="btnShuffle" title="Shuffle">🔀 Shuffle</button>
    <button id="btnRestart" title="Restart (R)">🔄 Restart</button>
    <button id="btnPause" title="Pause">⏸ Pause</button>
    <button id="btnRandom" title="Random level">🎲 Random</button>
    <button id="btnDaily" title="Daily challenge">📅 Daily</button>
    <button id="btnNext" title="Next level">Next ⏭</button>
  </footer>
</div>

<canvas id="confettiCanvas"></canvas>

<div class="modal-overlay" id="winModal">
  <div class="modal">
    <h2 id="winTitle">🎉 Level Complete!</h2>
    <div id="winLevelText" style="opacity:.8;font-size:.9rem;">Level 1</div>
    <div class="stars-row" id="winStars">⭐⭐⭐</div>
    <div class="modal-stats">
      <div>Moves<span id="winMoves">0</span></div>
      <div>Time<span id="winTime">00:00</span></div>
      <div>Best<span id="winBestFlag">New!</span></div>
    </div>
    <div class="modal-actions">
      <button id="winNextBtn">Next Level ⏭</button>
      <button class="secondary" id="winReplayBtn">Replay 🔄</button>
      <button class="secondary" id="winCloseBtn">Close</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="pauseModal">
  <div class="modal">
    <h2>⏸ Paused</h2>
    <p style="opacity:.8;">Take your time. Click resume when ready.</p>
    <div class="modal-actions">
      <button id="resumeBtn">▶ Resume</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal" style="max-width:440px;">
    <button class="close-x" id="settingsCloseX">✕</button>
    <h2>⚙️ Settings</h2>
    <div class="settings-row">
      <span>Sound Effects</span>
      <label class="switch"><input type="checkbox" id="soundToggle"><span class="slider-el"></span></label>
    </div>
    <div class="settings-row">
      <span>Dark Mode</span>
      <label class="switch"><input type="checkbox" id="themeToggle"><span class="slider-el"></span></label>
    </div>
    <div class="settings-row" style="flex-direction:column;align-items:flex-start;">
      <span>Jump to level (1-100)</span>
      <div class="level-jump">
        <input type="number" id="levelJumpInput" min="1" max="100" value="1">
        <button id="levelJumpBtn">Go</button>
      </div>
    </div>
    <div class="settings-row" style="flex-direction:column;align-items:flex-start;">
      <span style="margin-bottom:8px;">🏆 Achievements</span>
      <div class="ach-list" id="achList"></div>
    </div>
    <div class="settings-row">
      <span>Total Progress</span>
      <span id="totalProgressText" style="font-weight:700;">0%</span>
    </div>
    <div class="modal-actions">
      <button class="secondary" id="resetProgressBtn">Reset Progress</button>
      <button id="settingsCloseBtn">Done</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* ============ SHARED PUZZLE RULES ============
 * Pure functions with no DOM/game dependency, used by BOTH the live game
 * and the offline-style puzzle generator/solver, so the rules only live
 * in one place (no duplicated logic).
 */
function getMoveInfo(tubes, from, to){
  if(from===to) return null;
  const src=tubes[from], dst=tubes[to];
  if(!src || !dst) return null;
  if(src.length===0) return null;
  if(dst.length>=CAPACITY) return null;
  const color = src[src.length-1];
  if(dst.length>0 && dst[dst.length-1]!==color) return null;
  let cnt=0;
  for(let i=src.length-1;i>=0;i--){ if(src[i]===color) cnt++; else break; }
  const space = CAPACITY - dst.length;
  const count = Math.min(cnt,space);
  if(count<=0) return null;
  return {count,color};
}
function checkWinState(tubes){
  return tubes.every(t => t.length===0 || (t.length===CAPACITY && t.every(b=>b===t[0])));
}

/* ============ SEEDED RNG ============ */
function mulberry32(seed){
  let a = seed>>>0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = (t + Math.imul(t ^ t>>>7, 61 | t)) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

      if(t.length===0) continue;
      let breaks = 0;
      for(let i=1;i<t.length;i++) if(t[i]!==t[i-1]) breaks++;
      h += breaks*2;
      if(t.length<CAPACITY) h += 0.3;
    }
    return h;
  },
  // Minimal binary heap for the weighted-A* search
  _Heap: class{
    constructor(){ this.a=[]; }
    push(item){ this.a.push(item); let i=this.a.length-1;
      while(i>0){ const p=(i-1)>>1; if(this.a[p][0]<=this.a[i][0]) break; [this.a[p],this.a[i]]=[this.a[i],this.a[p]]; i=p; } }
    pop(){ const top=this.a[0]; const last=this.a.pop();
      if(this.a.length){ this.a[0]=last; let i=0;
        while(true){ let l=2*i+1,r=2*i+2,s=i;
          if(l<this.a.length && this.a[l][0]<this.a[s][0]) s=l;
          if(r<this.a.length && this.a[r][0]<this.a[s][0]) s=r;
          if(s===i) break; [this.a[s],this.a[i]]=[this.a[i],this.a[s]]; i=s; } }
      return top; }
    get size(){ return this.a.length; }
  },
  solve(startTubes, nodeBudget){
    const start = startTubes.map(t=>t.slice());
    if(checkWinState(start)) return {solved:true, moves:0};
    const Heap = this._Heap;
    const heap = new Heap();
    const visited = new Map();
    const keyOf = (tubes)=>tubes.map(t=>t.join(',')).join('|');
    visited.set(keyOf(start), 0);
    heap.push([this.heuristic(start), 0, start]);
    let nodes = 0;
    while(heap.size>0){
      const [,g,state] = heap.pop();
      if(checkWinState(state)) return {solved:true, moves:g};
      nodes++;
      if(nodes>nodeBudget) return {solved:false, moves:-1};
      const n = state.length;
      for(let from=0; from<n; from++){
        if(state[from].length===0) continue;
        for(let to=0; to<n; to++){
          if(from===to) continue;
          const info = getMoveInfo(state, from, to);
          if(!info) continue;
          const ns = state.map(t=>t.slice());
          for(let i=0;i<info.count;i++) ns[to].push(ns[from].pop());
          const k = keyOf(ns);
          const ng = g+1;
          if(visited.has(k) && visited.get(k)<=ng) continue;
          visited.set(k, ng);
          heap.push([ng + this.heuristic(ns)*2.2, ng, ns]);
        }
      }
    }
    return {solved:false, moves:-1};
  },
  // Generates a guaranteed-solvable puzzle; falls back to a safe default if
  // (very rarely) verification keeps failing within the attempt budget.
  generate(seed, numColors, numEmpty, opts){
    opts = opts||{};
    const maxAttempts = opts.maxAttempts||30;
    const nodeBudget = opts.nodeBudget||120000;
    for(let attempt=0; attempt<maxAttempts; attempt++){
      const rand = mulberry32(seed + attempt*7919 + 17);
      const tubes = this.randomFill(rand, numColors, numEmpty);
      if(checkWinState(tubes)) continue;
      const res = this.solve(tubes, nodeBudget);
      if(res.solved) return {tubes, numColors, moves:res.moves};
    }
    // Fallback: a small, always-solvable hand-made layout
    const fallbackTubes = this.randomFill(mulberry32(seed), Math.min(numColors,4), Math.max(numEmpty,2));
    return {tubes:fallbackTubes, numColors:Math.min(numColors,4), moves:20};
  }
};

/* ============ SOUND ============ */
class SoundManager{
  constructor(enabled){ this.enabled = enabled; this.ctx = null; }
  ensure(){
    if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; } }
    return this.ctx;
  }
  tone(freq,dur,type,vol,delay){
    if(!this.enabled) return;
    const ctx = this.ensure(); if(!ctx) return;
    type = type||'sine'; vol = vol===undefined?0.18:vol; delay = delay||0;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(vol,t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  }
  move(){ this.tone(520,0.12,'sine',0.15); }
  invalid(){ this.tone(140,0.18,'square',0.12); }
  win(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,0.35,'triangle',0.16,i*0.12)); }
  achievement(){ this.tone(880,0.15,'sine',0.15); this.tone(1174,0.28,'sine',0.15,0.15); }
}

/* ============ CONFETTI ============ */
class ConfettiSystem{
  constructor(canvas){
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    this.particles = []; this.running = false;
    window.addEventListener('resize', ()=>this.resize());
    this.resize();
  }
  resize(){ this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
  launch(){
    this.particles = [];
    const colors = ['#ff6b6b','#54a0ff','#1dd1a1','#feca57','#a55eea','#ff9f43','#fd79a8','#48dbfb'];
    for(let i=0;i<140;i++){
      this.particles.push({
        x: Math.random()*this.canvas.width,
        y: -20 - Math.random()*this.canvas.height*0.3,
        vx: (Math.random()-0.5)*3,
        vy: 2+Math.random()*4,
        size: 5+Math.random()*6,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*360,
        vr: (Math.random()-0.5)*10,
        shape: Math.random()>0.5?'rect':'circle'
      });
    }
    if(!this.running){ this.running=true; this.startTime=performance.now(); this.loop(); }
  }
  loop(){
    const ctx = this.ctx;
    ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    let alive=false;
    const elapsed = performance.now()-this.startTime;
    this.particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.rot+=p.vr;
      if(p.y<this.canvas.height+20) alive=true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180); ctx.fillStyle=p.color;
      if(p.shape==='rect') ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      else{ ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    if(alive && elapsed<6000){ requestAnimationFrame(()=>this.loop()); }
    else{ this.running=false; ctx.clearRect(0,0,this.canvas.width,this.canvas.height); }
  }
}

  {id:'first_win', name:'First Victory', icon:'🥇', desc:'Complete your first level', check:g=>Object.keys(g.progress.completed).length>=1},
  {id:'ten_levels', name:'Getting Good', icon:'🔥', desc:'Complete 10 levels', check:g=>Object.keys(g.progress.completed).length>=10},
  {id:'fifty_levels', name:'Halfway Hero', icon:'🚀', desc:'Complete 50 levels', check:g=>Object.keys(g.progress.completed).length>=50},
  {id:'all_levels', name:'Master Sorter', icon:'👑', desc:'Complete all 100 levels', check:g=>Object.keys(g.progress.completed).length>=100},
  {id:'no_undo', name:'Flawless', icon:'✨', desc:'Win a level without using undo', check:g=>g.usedUndo===false && g.lastWon},
  {id:'speedy', name:'Speed Runner', icon:'⚡', desc:'Win a level in under 20 seconds', check:g=>g.lastWon && g.seconds<20},
  {id:'perfect_moves', name:'Perfectionist', icon:'💎', desc:'Win with a 3-star rating', check:g=>g.lastWon && g.lastStars===3}

/* ============ MAIN GAME ============ */
class BallSortGame{
  constructor(){
    this.capacity = CAPACITY;
    this.settings = StorageManager.getSettings();
    this.progress = StorageManager.getProgress();
    this.unlockedAch = StorageManager.getAchievements();
    this.sound = new SoundManager(this.settings.sound!==false);
    this.confetti = new ConfettiSystem(document.getElementById('confettiCanvas'));
    this.level = this.clampLevel(this.progress.currentLevel||1);
    this.tubes = [];
    this.numColors = 3;
    this.par = 10;
    this.selected = null;
    this.cursor = 0;
    this.moves = 0;
    this.seconds = 0;
    this.timer = null;
    this.paused = false;
    this.animating = false;
    this.undoStack = [];
    this.usedUndo = false;
    this.hintPair = null;
    this.isDaily = false;
    this.lastWon = false;
    this.lastStars = 0;
    this.autoNextTimeout = null;
    this.bindUI();
    this.applySettingsToUI();
    this.loadLevel(this.level);
  }

  clampLevel(n){ return Math.max(1, Math.min(LEVEL_COUNT, n||1)); }

  /* ---------- level lifecycle ---------- */
  loadLevel(n){
    this.isDaily = false;
    this.level = this.clampLevel(n);
    const data = LEVELS[this.level-1];
    this.tubes = data[0].map(t=>t.slice());
    this.numColors = data[1];
    this.par = data[2];
    this.resetRoundState();
    this.progress.currentLevel = this.level;
    StorageManager.saveProgress(this.progress);
    this.render();
    this.updateStats();
    this.updateProgressBar();
  }

  loadDaily(){
    const today = new Date().toDateString();
    const seed = Math.abs(this.hashCode(today));
    const gen = PuzzleLab.generate(seed, 6, 2, {maxAttempts:30, nodeBudget:150000});
    this.tubes = gen.tubes.map(t=>t.slice());
    this.numColors = gen.numColors;
    this.par = gen.moves;
    this.isDaily = true;
    this.resetRoundState();
    this.render();
    this.updateStats();
    this.toast('Daily Challenge loaded!');
  }

  resetRoundState(){
    this.selected = null; this.moves = 0; this.seconds = 0;
    this.undoStack = []; this.usedUndo = false; this.hintPair = null;
    this.cursor = 0; this.lastWon = false;
    this.stopTimer(); this.startTimer();
  }

  hashCode(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
    return h;
  }

  startTimer(){
    this.timer = setInterval(()=>{
      if(!this.paused){
        this.seconds++;
        const el = document.getElementById('statTime');
        if(el) el.textContent = formatTime(this.seconds);
      }
    },1000);
  }
  stopTimer(){ if(this.timer) clearInterval(this.timer); this.timer=null; }

  /* ---------- move logic (delegates to the shared rules) ---------- */
  getMoveInfo(from,to){ return getMoveInfo(this.tubes, from, to); }
  checkWin(){ return checkWinState(this.tubes); }

  onTubeClick(idx){
    if(this.paused || this.animating) return;
    this.cursor = idx;
    if(this.selected===null){
      if(this.tubes[idx].length===0){ this.sound.invalid(); this.shakeTube(idx); this.render(); return; }
      this.selected = idx; this.render();
    } else if(this.selected===idx){
      this.selected = null; this.render();
    } else {
      const from = this.selected;
      this.selected = null;
      this.attemptMove(from, idx);
    }
  }

  attemptMove(from,to){
    const info = this.getMoveInfo(from,to);
    if(!info){ this.sound.invalid(); this.shakeTube(to); this.render(); return; }
    this.pushUndo();
    this.hintPair = null;
    this.performMove(from,to,info.count);
  }

  pushUndo(){
    this.undoStack.push({ tubes: this.tubes.map(t=>t.slice()), moves: this.moves });
    if(this.undoStack.length>300) this.undoStack.shift();
  }

  undo(){
    if(this.undoStack.length===0 || this.animating) return;
    const prev = this.undoStack.pop();
    this.tubes = prev.tubes;
    this.moves = prev.moves;
    this.selected = null;
    this.usedUndo = true;
    this.render();
    this.updateStats();
  }

  performMove(from,to,count){
    this.animating = true;
    const tubeEls = [...document.querySelectorAll('.tube')];
    const srcEl = tubeEls[from];
    const srcBalls = [...srcEl.querySelectorAll('.ball')];
    const movingEls = srcBalls.slice(srcBalls.length - count);
    const oldRects = movingEls.map(el=>el.getBoundingClientRect());

    for(let i=0;i<count;i++){ this.tubes[to].push(this.tubes[from].pop()); }
    this.moves++;

    this.render();

    const tubeEls2 = [...document.querySelectorAll('.tube')];
    const dstEl = tubeEls2[to];
    const dstBalls = [...dstEl.querySelectorAll('.ball')];
    const newBalls = dstBalls.slice(dstBalls.length - count);
    const newRects = newBalls.map(el=>el.getBoundingClientRect());
    newBalls.forEach(el=>{ el.style.opacity = '0'; });

    const clones = [];
    movingEls.forEach((el,i)=>{
      const rect = oldRects[i];
      const clone = el.cloneNode(true);
      clone.className = 'ball-flying';
      clone.style.background = el.style.background;
      clone.style.border = el.style.border;
      clone.style.left = rect.left+'px';
      clone.style.top = rect.top+'px';
      clone.style.width = rect.width+'px';
      clone.style.height = rect.height+'px';
      document.body.appendChild(clone);
      clones.push(clone);
    });

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        clones.forEach((clone,i)=>{
          const target = newRects[i] || newRects[newRects.length-1];
          if(target){ clone.style.left = target.left+'px'; clone.style.top = target.top+'px'; }
        });
      });
    });

    this.sound.move();

    setTimeout(()=>{
      clones.forEach(c=>c.remove());
      newBalls.forEach(el=>{ el.style.opacity = '1'; });
      this.animating = false;
      this.updateStats();
      if(this.checkWin()){ this.onWin(); }
    },380);
  }

  shakeTube(idx){
    const els = document.querySelectorAll('.tube');
    const el = els[idx];
    if(!el) return;
    el.classList.add('invalid-shake');
    setTimeout(()=>el.classList.remove('invalid-shake'),400);
  }

  /* ---------- hint / shuffle ---------- */
  computeHint(){
    let best=null, bestScore=-Infinity;
    for(let f=0; f<this.tubes.length; f++){
      for(let t=0; t<this.tubes.length; t++){
        if(f===t) continue;
        const info = this.getMoveInfo(f,t);
        if(!info) continue;
        let score=0;
        const dst = this.tubes[t], src = this.tubes[f];
        if(dst.length>0) score += 3;
        if(dst.length+info.count===this.capacity) score += 5;
        if(src.length-info.count===0) score += 2;
        if(src.length===this.capacity && src.every(b=>b===src[0])) score -= 100;
        if(score>bestScore){ bestScore=score; best={from:f,to:t}; }
      }
    }
    return best;
  }

  hint(){
    if(this.animating || this.paused) return;
    const move = this.computeHint();
    if(!move){ this.toast('No hint available'); return; }
    this.hintPair = move;
    this.render();
    setTimeout(()=>{ this.hintPair=null; this.render(); },1800);
  }

  shuffle(){
    if(this.animating || this.paused) return;
    // Randomly applying legal moves can accidentally lock the puzzle into an
    // unsolvable state, so every candidate shuffle is verified with the real
    // solver before being accepted; if nothing solvable turns up we leave the
    // puzzle untouched rather than risk breaking it.
    const steps = 8;
    const nodeBudget = Math.min(250000, 15000 + this.tubes.length*15000);
    let accepted = null;
    for(let attempt=0; attempt<12 && !accepted; attempt++){
      const candidate = this.randomLegalShuffle(this.tubes, steps);
      if(checkWinState(candidate)) continue; // don't accidentally "shuffle" straight into a win
      const res = PuzzleLab.solve(candidate, nodeBudget);
      if(res.solved) accepted = candidate;
    }
    if(accepted){
      this.tubes = accepted;
      this.selected = null;
      this.render();
      this.toast('Shuffled! Still solvable 🔀');
    } else {
      this.toast('Could not find a safe shuffle — left as is');
    }
  }

  randomLegalShuffle(tubes, steps){
    const t = tubes.map(x=>x.slice());
    let lastMove=null, performed=0, attempts=0;
    while(performed<steps && attempts<300){
      attempts++;
      const from = Math.floor(Math.random()*t.length);
      const to = Math.floor(Math.random()*t.length);
      if(from===to) continue;
      if(lastMove && lastMove.from===to && lastMove.to===from) continue;
      const info = getMoveInfo(t,from,to);
      if(!info) continue;
      for(let i=0;i<info.count;i++) t[to].push(t[from].pop());
      lastMove = {from,to}; performed++;
    }
    return t;
  }

  /* ---------- level navigation ---------- */
  restartLevel(){ if(this.animating) return; if(this.isDaily) this.loadDaily(); else this.loadLevel(this.level); }
  prevLevel(){ if(this.animating || this.isDaily) return; if(this.level>1) this.loadLevel(this.level-1); }
  nextLevel(){ if(this.animating) return; if(this.isDaily){ this.loadLevel(this.progress.currentLevel||1); return;} if(this.level<LEVEL_COUNT) this.loadLevel(this.level+1); else this.toast('🎉 All levels complete!'); }
  randomLevel(){ if(this.animating) return; const n = 1+Math.floor(Math.random()*LEVEL_COUNT); this.loadLevel(n); }

  togglePause(){
    this.paused = !this.paused;
    document.getElementById('pauseModal').classList.toggle('show', this.paused);
  }

  computeStars(){
    const par = this.par||10;
    if(this.moves<=par) return 3;
    if(this.moves<=Math.ceil(par*1.5)) return 2;
    return 1;
  }

  onWin(){
    this.stopTimer();
    this.lastWon = true;
    const stars = this.computeStars();
    this.lastStars = stars;
    let isNewBest = false;
    if(!this.isDaily){
      const prevBest = this.progress.completed[this.level];
      isNewBest = !prevBest || this.moves < prevBest.moves;
      if(isNewBest){ this.progress.completed[this.level] = {moves:this.moves, time:this.seconds, stars}; }
      this.progress.totalCompleted = Object.keys(this.progress.completed).length;
      StorageManager.saveProgress(this.progress);
    }
    this.checkAchievements();
    this.sound.win();
    this.confetti.launch();
    this.showWinModal(stars,isNewBest);
    this.updateProgressBar();
    this.updateStats();
  }

  checkAchievements(){
    ACHIEVEMENTS.forEach(ach=>{
      if(!this.unlockedAch.includes(ach.id) && ach.check(this)){
        this.unlockedAch.push(ach.id);
        StorageManager.saveAchievements(this.unlockedAch);
        this.sound.achievement();
        this.toast('🏆 Achievement: '+ach.name);
      }
    });
  }

  showWinModal(stars,isNewBest){
    document.getElementById('winLevelText').textContent = this.isDaily ? 'Daily Challenge' : ('Level '+this.level);
    document.getElementById('winMoves').textContent = this.moves;
    document.getElementById('winTime').textContent = formatTime(this.seconds);
    document.getElementById('winStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
    document.getElementById('winBestFlag').textContent = isNewBest ? 'New!' : '—';
    document.getElementById('winNextBtn').style.display = (this.isDaily || this.level>=LEVEL_COUNT) ? 'none' : 'inline-block';
    document.getElementById('winModal').classList.add('show');
    clearTimeout(this.autoNextTimeout);
    if(!this.isDaily && this.level<LEVEL_COUNT){
      this.autoNextTimeout = setTimeout(()=>{ this.closeWinModal(); this.nextLevel(); },4000);
    }
  }
  closeWinModal(){
    document.getElementById('winModal').classList.remove('show');
    clearTimeout(this.autoNextTimeout);
  }

  /* ---------- rendering ---------- */
  render(){
    const container = document.getElementById('tubesContainer');
    container.innerHTML = '';
    container.classList.toggle('compact', this.tubes.length>9);
    this.tubes.forEach((tube,idx)=>{
      const tubeEl = document.createElement('div');
      tubeEl.className = 'tube';
      tubeEl.dataset.idx = idx;
      tubeEl.tabIndex = 0;
      tubeEl.setAttribute('role','button');
      tubeEl.setAttribute('aria-label','Tube '+(idx+1));
      if(this.selected===idx) tubeEl.classList.add('selected');
      if(this.cursor===idx) tubeEl.classList.add('cursor');
      if(this.hintPair){
        if(this.hintPair.from===idx) tubeEl.classList.add('hint-from');
        if(this.hintPair.to===idx) tubeEl.classList.add('hint-to');
      }
      tube.forEach(colorIdx=>{
        const ballEl = document.createElement('div');
        ballEl.className = 'ball';
        const col = COLORS[colorIdx % COLORS.length];
        ballEl.style.background = 'radial-gradient(circle at 32% 28%, #ffffffcc, '+col.l+' 42%, '+col.d+' 100%)';
        ballEl.style.border = '1px solid '+col.d;
        tubeEl.appendChild(ballEl);
      });
      tubeEl.addEventListener('click',()=>this.onTubeClick(idx));
      // Keep the keyboard cursor in sync when a tube gets native Tab focus,
      // so Tab+Enter/Space activates the same tube that's visibly focused
      // (avoid a full re-render here, which would rebuild the DOM and yank focus away).
      tubeEl.addEventListener('focus',()=>{ this.cursor = idx; });
      container.appendChild(tubeEl);
    });
  }

  updateStats(){
    document.getElementById('statLevel').textContent = this.isDaily ? 'Daily' : this.level;
    document.getElementById('statMoves').textContent = this.moves;
    document.getElementById('statTime').textContent = formatTime(this.seconds);
    const best = this.isDaily ? null : this.progress.completed[this.level];
    document.getElementById('statBest').textContent = best ? (best.moves+' mv') : '--';
    document.getElementById('btnUndo').disabled = this.undoStack.length===0;
    document.getElementById('btnPrev').disabled = this.level<=1 || this.isDaily;
    document.getElementById('btnNext').disabled = (this.level>=LEVEL_COUNT && !this.isDaily);
  }

  updateProgressBar(){
    const pct = Object.keys(this.progress.completed).length / LEVEL_COUNT * 100;
    document.getElementById('progressBar').style.width = pct+'%';
    document.getElementById('totalProgressText').textContent = Math.round(pct)+'%';
  }

  toast(msg){
    if(!this._toastQueue) this._toastQueue = [];
    this._toastQueue.push(msg);
    if(!this._toastShowing) this.drainToastQueue();
  }
  drainToastQueue(){
    const el = document.getElementById('toast');
    const next = this._toastQueue.shift();
    if(next===undefined){ this._toastShowing = false; return; }
    this._toastShowing = true;
    el.textContent = next;
    el.classList.add('show');
    clearTimeout(this._toastTimeout);
    this._toastTimeout = setTimeout(()=>{
      el.classList.remove('show');
      setTimeout(()=>this.drainToastQueue(), 220);
    },2000);
  }

  /* ---------- settings ---------- */
  applySettingsToUI(){
    document.body.classList.toggle('light', this.settings.theme==='light');
    document.getElementById('btnTheme').textContent = this.settings.theme==='light' ? '☀️' : '🌙';
    document.getElementById('btnSound').textContent = this.settings.sound ? '🔊' : '🔇';
    document.getElementById('soundToggle').checked = !!this.settings.sound;
    document.getElementById('themeToggle').checked = this.settings.theme==='dark';
    this.renderAchievements();
  }

  renderAchievements(){
    const list = document.getElementById('achList');
    list.innerHTML = '';
    ACHIEVEMENTS.forEach(a=>{
      const unlocked = this.unlockedAch.includes(a.id);
      const div = document.createElement('div');
      div.className = 'ach-item'+(unlocked?' unlocked':'');
      div.innerHTML = '<div class="ach-icon">'+(unlocked?a.icon:'🔒')+'</div><div><div class="ach-name">'+a.name+'</div><div class="ach-desc">'+a.desc+'</div></div>';
      list.appendChild(div);
    });
  }

  toggleTheme(){
    this.settings.theme = this.settings.theme==='dark' ? 'light' : 'dark';
    StorageManager.saveSettings(this.settings);
    this.applySettingsToUI();
  }
  toggleSound(){
    this.settings.sound = !this.settings.sound;
    this.sound.enabled = this.settings.sound;
    StorageManager.saveSettings(this.settings);
    this.applySettingsToUI();
  }

  /* ---------- UI binding ---------- */
  bindUI(){
    document.getElementById('btnTheme').addEventListener('click',()=>this.toggleTheme());
    document.getElementById('btnSound').addEventListener('click',()=>this.toggleSound());
    document.getElementById('btnSettings').addEventListener('click',()=>{
      this.renderAchievements();
      this.updateProgressBar();
      document.getElementById('settingsModal').classList.add('show');
    });
    document.getElementById('settingsCloseBtn').addEventListener('click',()=>document.getElementById('settingsModal').classList.remove('show'));
    document.getElementById('settingsCloseX').addEventListener('click',()=>document.getElementById('settingsModal').classList.remove('show'));
    document.getElementById('soundToggle').addEventListener('change',()=>this.toggleSound());
    document.getElementById('themeToggle').addEventListener('change',()=>this.toggleTheme());
    document.getElementById('levelJumpBtn').addEventListener('click',()=>{
      const v = parseInt(document.getElementById('levelJumpInput').value,10);
      if(v>=1 && v<=LEVEL_COUNT){ this.loadLevel(v); document.getElementById('settingsModal').classList.remove('show'); }
    });
    document.getElementById('resetProgressBtn').addEventListener('click',()=>{
      if(confirm('Reset all progress and achievements?')){
        StorageManager.resetAll();
        this.progress = StorageManager.getProgress();
        this.unlockedAch = StorageManager.getAchievements();
        this.renderAchievements();
        this.updateProgressBar();
        this.loadLevel(1);
        this.toast('Progress reset');
      }
    });

    document.getElementById('btnPrev').addEventListener('click',()=>this.prevLevel());
    document.getElementById('btnNext').addEventListener('click',()=>this.nextLevel());
    document.getElementById('btnUndo').addEventListener('click',()=>this.undo());
    document.getElementById('btnHint').addEventListener('click',()=>this.hint());
    document.getElementById('btnShuffle').addEventListener('click',()=>this.shuffle());
    document.getElementById('btnRestart').addEventListener('click',()=>this.restartLevel());
    document.getElementById('btnPause').addEventListener('click',()=>this.togglePause());
    document.getElementById('btnRandom').addEventListener('click',()=>this.randomLevel());
    document.getElementById('btnDaily').addEventListener('click',()=>this.loadDaily());
    document.getElementById('resumeBtn').addEventListener('click',()=>this.togglePause());

    document.getElementById('winNextBtn').addEventListener('click',()=>{ this.closeWinModal(); this.nextLevel(); });
    document.getElementById('winReplayBtn').addEventListener('click',()=>{ this.closeWinModal(); this.restartLevel(); });
    document.getElementById('winCloseBtn').addEventListener('click',()=>this.closeWinModal());

    document.addEventListener('keydown',(e)=>{
      if(document.getElementById('winModal').classList.contains('show')){
        if(e.key==='Escape') this.closeWinModal();
        return;
      }
      if(this.paused && e.key!=='Escape') return;
      switch(e.key){
        case 'ArrowRight':
          this.cursor = (this.cursor+1) % this.tubes.length; this.render(); break;
        case 'ArrowLeft':
          this.cursor = (this.cursor-1+this.tubes.length) % this.tubes.length; this.render(); break;
        case 'Enter': case ' ':
          e.preventDefault(); this.onTubeClick(this.cursor); break;
        case 'r': case 'R':
          this.restartLevel(); break;
        case 'u': case 'U':
          this.undo(); break;
        case 'h': case 'H':
          this.hint(); break;
        case 'Escape':
          if(this.paused) this.togglePause();
          break;
      }
    });
  }
}

/* ============ INIT ============ */
document.addEventListener('DOMContentLoaded', ()=>{
  window.game = new BallSortGame();
});
})();
</script>
